{% extends "base.html" %}
{% block titulo %}Patrocinadores{% endblock %}
{% block conteudo %}
  <h1>Patrocinadores</h1>
  {% for patrocinador in patrocinadores %}
    <div class="card">
      <h3>{{ patrocinador.nome }}</h3>
      <p>{{ patrocinador.nivel }}</p>
    </div>
  {% else %}
    <p>Nenhum patrocinador cadastrado ainda.</p>
  {% endfor %}
{% endblock %}
