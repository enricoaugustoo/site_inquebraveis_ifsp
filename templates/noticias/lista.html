{% extends "base.html" %}
{% block titulo %}Notícias{% endblock %}
{% block conteudo %}
  <h1>Notícias</h1>
  {% for noticia in noticias %}
    <div class="card">
      <h3><a href="{{ url_for('detalhe_noticia', slug=noticia.slug) }}">{{ noticia.titulo }}</a></h3>
      <p>{{ noticia.data_publicacao }} — {{ noticia.resumo }}</p>
    </div>
  {% else %}
    <p>Nenhuma notícia cadastrada ainda.</p>
  {% endfor %}
{% endblock %}
