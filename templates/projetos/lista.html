{% extends "base.html" %}
{% block titulo %}Projetos{% endblock %}
{% block conteudo %}
  <h1>Projetos</h1>
  {% for projeto in projetos %}
    <div class="card">
      <h3><a href="{{ url_for('detalhe_projeto', slug=projeto.slug) }}">{{ projeto.nome }}</a></h3>
      <p>Área: {{ projeto.area }}</p>
    </div>
  {% else %}
    <p>Nenhum projeto cadastrado ainda.</p>
  {% endfor %}
{% endblock %}
