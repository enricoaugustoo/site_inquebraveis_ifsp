<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Os Inquebráveis — equipe do IFSP Caraguatatuba.">
  <title>{% block titulo %}Os Inquebráveis{% endblock %} — Os Inquebráveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Os Inquebráveis — início">
        <img src="{{ url_for('static', filename='img/logomarca-equipe.png') }}" alt="Os Inquebráveis">
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Navegação principal">
        <a href="{{ url_for('home') }}">Início</a>
        <a href="{{ url_for('lista_projetos') }}">Projetos</a>
        <a href="{{ url_for('lista_competicoes') }}">Competições</a>
        <a href="{{ url_for('lista_membros') }}">Equipe</a>
        <a href="{{ url_for('lista_noticias') }}">Notícias</a>
        <a href="{{ url_for('lista_patrocinadores') }}">Apoio</a>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <div class="footer-brand">OS INQUEBRÁVEIS<span>.</span></div>
        <p>Equipe do IFSP Caraguatatuba.</p>
      </div>
      <div class="footer-links">
        <a href="{{ url_for('lista_projetos') }}">Projetos</a>
        <a href="{{ url_for('lista_competicoes') }}">Competições</a>
        <a href="{{ url_for('lista_membros') }}">Equipe</a>
        <a href="{{ url_for('lista_noticias') }}">Notícias</a>
      </div>
    </div>
    <div class="container footer-bottom">
      <span>Os Inquebráveis</span>
      <a href="{{ url_for('admin_login') }}">Área administrativa</a>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/site.js') }}"></script>
</body>
</html>
